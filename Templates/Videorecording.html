{% extends "home.html" %}
{% load static %}
{% block content %}
<h1>Sermons</h1>

<div>
    <img src="{% url 'video_feed' %}" width="640" height="480" alt="Live server camera feed">
    <p id="cameraStatus" role="status">Live feed is provided by the camera attached to the server.</p>

    <button id="startRecordingButton" type="button" onclick="startRecording()">Start recording</button>
    <button id="stopRecordingButton" type="button" onclick="stopRecording()">Stop recording</button>
    <button type="button" onclick="listVideos()">List recordings</button>
    <div id="videoList"></div>
</div>

<script src="{% static 'events/camera.js' %}"></script>
{% endblock %}
