{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sermons</title>

    <style>
        body {
            text-align: center;
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
        }

        video {
            width: 80%;
            max-width: 900px;
            border: 3px solid white;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Sermons</h1>

    <video id="camera" autoplay playsinline muted></video>

    <br><br>

    <button onclick="startRecording()">
        Start Recording
    </button>

    <button onclick="stopRecording()">
        Stop Recording
    </button>

    <button onclick="listVideos()">
        List Videos
    </button>

    <div id="videoList"></div>

    <script src="{% static 'events/camera.js' %}"></script>

    <script>
        const video = document.getElementById("camera");

        navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
        })
        .then(stream => {
            video.srcObject = stream;
        })
        .catch(err => {
            console.error("Camera Error:", err);
        });
    </script>

</body>
</html>
